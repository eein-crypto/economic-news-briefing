name: 경제 뉴스 자동 수집

on:
  schedule:
    # 매일 8시 (UTC+9 기준, 23시 UTC)
    - cron: '0 23 * * *'
  
  # 수동 실행 옵션
  workflow_dispatch:

jobs:
  fetch-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 뉴스 수집
        run: node scripts/fetch-news.mjs

      - name: 뉴스 분석
        run: node scripts/analyze-news.mjs

      - name: 변경사항 커밋 및 푸시
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 변경사항이 있는지 확인
          if git diff --quiet public/data/; then
            echo "변경사항이 없습니다."
          else
            git add public/data/
            git commit -m "chore: 경제 뉴스 자동 수집 - $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi

      - name: 성공 로그
        if: success()
        run: |
          echo "✅ 뉴스 수집 및 분석 완료!"
          echo "📊 수집 시간: $(date +'%Y-%m-%d %H:%M:%S')"

      - name: 실패 로그
        if: failure()
        run: |
          echo "❌ 뉴스 수집 중 오류 발생"
          echo "📊 실패 시간: $(date +'%Y-%m-%d %H:%M:%S')"
